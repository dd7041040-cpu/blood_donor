<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Donor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">🩸 BLOOD DONOR</div>

        <nav>
            <a href="../home/index.html">Home</a>
            <a href="register.html">Register</a>
            <a href="../donors/donors.html">Find Donor</a>
            <a href="../about/about.html">About</a>
        </nav>
    </header>

    <main class="register-container">

        <h1>Register as a Blood Donor</h1>
        <p class="subtitle">Your donation can help save a life.</p>

        <form id="donorForm">

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="age">Age</label>
            <input type="number" id="age" placeholder="Enter your age" required>

            <label for="blood">Blood Group</label>
            <select id="blood" required>
                <option value="">Select Blood Group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>O+</option>
                <option>O-</option>
                <option>AB+</option>
                <option>AB-</option>
            </select>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter phone number" required>

            <label for="location">Location</label>
            <input type="text" id="location" placeholder="Enter your location" required>

            <button type="submit">Register Donor</button>

        </form>

        <p id="message"></p>

    </main>

    <footer>
        <p>🩸 Every Drop Can Save a Life ❤️</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
